直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：板卡正反面与丝印", "P3：摄像头和排线端头，断电拍摄", "P4：系统/内核输出截图，隐藏网络标识"]}, {"id": "02", "title": "摄像头黑屏，先别怪排线", "body": "摄像头没画面时，最想做的事就是换排线。可“换到能用”和“知道为什么能用”，是两种完全不同的复现。🔍\n\n这期我把问题拆成四层：物理连接→设备树配置→内核探测→视频输出。只修改其中一层，再保存前后差异。\n\noverlay可以理解成告诉系统“这个接口上装了什么设备”。在对应的Radxa OS环境里，用rsetup选择实际相机的配置，再重启验证；不是随便勾一个名字最熟悉的相机。\n\n接着看内核日志是否出现传感器相关信息，再列出视频设备。不要只靠“/dev/video0存在”宣布成功，也别复制树莓派命令后，把找不到命令当成摄像头损坏。\n\n我的复现规则：同一次实验不同时换镜像、换排线、改overlay。否则成功了也很难复述原因。\n\n这是一份黑屏定位方法，还不是本机已出图的战报。失败截图也会保留：它们比一句“重装好了”更有复现价值。\n\n你排障时会记每次改了什么吗？\n\n#Microduck #ZERO3W #摄像头调试 #Linux #嵌入式开发", "date": "2026-09-20", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDAyPC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3IiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPum7keWxj+S4jeS4gOWumuWdjzwvdGV4dD48dGV 已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：相机overlay选择界面", "P3：变更前后日志对比", "P4：一页排障树，不伪造成功勾选"]}, {"id": "03", "title": "找到video0，不等于看见鸭", "body": "Linux列出一串video设备，我差点给鸭子发“复明证书”。但设备节点不是照片，找到video0也不是验收。📷\n\n这期只做一件事：识别真正提供图像的节点，保存一张能打开的原始画面。\n\n先用v4l2-ctl查看设备能力和支持的格式，再看分辨率、像素格式能否被采集管线接受。某个节点可能不是你需要的输出，不能凭编号选它。\n\n采集的底层逻辑其实是：从V4L2取数据→必要的格式转换→编码→写入文件。若当前节点输出的是MJPEG或原始Bayer，而命令按普通raw视频处理，管线就可能协商失败；这时应先查格式，而不是无限重试。\n\n第一张照片不追求好看。我更想留下完整证据：用哪个节点、什么格式、哪条命令、文件能否解码。首帧通过后，才值得进入连续采集。\n\n这期先把验收方式说明白，不拿概念封面冒充首帧。真正的“鸭眼视角”，由实拍补上。\n\n你会先拍桌面，还是先拍自己？\n\n#Microduck #V4L2 #GStreamer #摄像头 #技术复现", "date": "2026-09-22", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDAzPC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3IiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0 nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：本机节点及格式输出\nP3：未经AI重绘的首帧原图\nP4：原始管线命令与失败/成功状态\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：本机节点及格式输出", "P3：未经AI重绘的首帧原图", "P4：原始管线命令与失败/成功状态"]}, {"id": "04", "title": "能出图，为什么还不能上鸭", "body": "“摄像头亮了”只是入门关，“持续可用”才是机器人需要的东西。🦆\n\n我给软件测试设了一个小目标：固定配置采集10分钟，记录帧到达间隔、读取失败次数和温度变化。10分钟是本次实验窗口，不是厂商认证标准。\n\n最想纠正的一个误会：平均帧率高，不等于延迟低。画面能顺畅播放，也可能积压了旧帧。程序读到一帧的时间，只能说明主机取帧时序；不能自动当作从曝光到显示的端到端延迟。\n\n因此我会把三种数据分开写：帧间隔分位数、采集失败计数、单独设计的端到端延迟实验。没有测到的字段留空，不拿估算凑成绩单。\n\n同样的道理，CPU占用和温度也要跟分辨率、编码方式一起记录。脱离配置谈性能，就像只说“鸭子跑得快”，却不说跑了多久。\n\n本期是稳定性测试设计。能连续工作、能解释波动，比一张漂亮截图更重要。\n\n你更在意画面清晰，还是反应够快？\n\n#Microduck #性能测试 #嵌入式Linux #摄像头调试 #工程实践", "date": "2026-09-24", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDA0PC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3 - [ ] 记录请求配置与设备实际返回配置\n- [ ] CSV保存单调时钟和每次读取结果\n- [ ] 报告p50/p95/p99帧间隔，不命名为端到端延迟\n- [ ] 温度传感器名称/单位明确；黑屏冻结需另做人工复核\n\n操作入口：[RUNBOOK L04](../../docs/RUNBOOK.md)；资料：S3、S4、S10，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：稳定性测试现场\nP3：由实际CSV绘制的曲线\nP4：配置表与异常时刻，不使用示意图当结果\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：稳定性测试现场", "P3：由实际CSV绘制的曲线", "P4：配置表与异常时刻，不使用示意图当结果"]}, {"id": "05", "title": "鸭没摔，是窗口先摔了", "body": "最有戏剧性的一次复现，不是鸭子摔倒，而是鸭子根本没机会出场。😅\n\n现有运行记录里，我启动了infer_policy.py，加载场景与步态的过程中遇到：The DISPLAY environment variable is missing，随后GLFW初始化失败。\n\n这个报错首先指向图形会话，不等于策略已经训练坏了。远程SSH里能执行Python，也不代表这个进程拥有可用的桌面窗口和图形权限。\n\n我把排查拆成三件事：计算能不能跑、离屏渲染能不能跑、交互窗口能不能打开。这三条链路不能混为一谈。设置MUJOCO_GL=egl可以参与离屏方案，但不会凭空给GLFW创建一个桌面。\n\n更不能随手export DISPLAY=:0，再用放开所有访问权限的方式碰运气。应从已建立的远程桌面终端启动交互viewer，先验证一个最小窗口，再回到完整策略。\n\n这期最想留下的心得：先给错误分层，再决定改哪一层。当前只确认遇到了这个问题，不提前宣布已经修好。\n\n你遇过“GPU很强，却连窗口都打不开”吗？\n\n#Microduck #MuJoCo #远程桌面 #强化学习 #踩坑记录", "date": "2026-09-26", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtY 题：鸭没摔，是窗口先摔了\n画面内容：小鸭站在抽象窗口外，窗口门牌为DISPLAY问号；左侧计算齿轮正常，右侧窗口连接断开，温柔幽默的技术诊断海报。\n后期排版主标题：鸭还没开始走 / 窗口先报错了（仅供理解，不在生成图中画字）。", "checklist": "# EP05｜鸭没摔，是窗口先摔了\n\n实验：2026-09-25–2026-09-26；建议发布：2026-09-26。\n\n## 第一天\n保留原始错误；在SSH与远程桌面终端分别检查DISPLAY、WAYLAND_DISPLAY、XDG_SESSION_TYPE。\n\n## 第二天\n按照L05在正确图形会话启动最小viewer，再运行原推理命令；未建立桌面时先阻塞GUI任务。\n\n## 技术验收\n- [ ] 区分ONNX GPU探测警告和GLFW致命错误\n- [ ] 不使用xhost +开放整个显示服务\n- [ ] 不把EGL设置当作交互viewer的通用修复\n- [ ] 只有录到可交互窗口才通过GUI关卡\n\n操作入口：[RUNBOOK L05](../../docs/RUNBOOK.md)；资料：S5、S6，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：已有GLFW报错，裁掉用户名路径\nP3：图形会话环境输出\nP4：修复后的窗口；未修复则放诊断分层图\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：已有GLFW报错，裁掉用户名路径", "P3：图形会话环境输出", "P4：修复后的窗口；未修复则放诊断分层图"]}, {"id": "06", "title": "14个动作，怎么装15颗舵机", "body": "看模型时遇到一个很像算术题的坑：策略有14个动作，整机方案又可能数出15颗舵机，到底谁少算了？🧩\n\n关键在于，我们数的不是同一种东西。\n\n在本系列核对的上游版本里，步态控制的是14个舵机关节。关节、执行器、刚体和采购清单，分别属于不同层级；被动关节也不一定占一个策略动作。嘴部等额外执行机构，更不能未经核对就塞进原来的动作数组。\n\n我会做一张映射表：动作索引→模型关节名→实机ID→方向→零位→限位。现在还没有实机确认的列，明确保留未知。\n\n这张表看起来没“鸭子走路”有观赏性，却决定后面一个正号到底是抬腿，还是反着顶住机械结构。\n\n所以本期不急着训练，先在MJCF里点名每个关节。截图里关节能动，不等于模型映射已经正确；有编号、有方向、有依据，才是真正的基础功。\n\n你会先看3D外观，还是先检查关节表？\n\n#Microduck #MJCF #MuJoCo #机器人结构 #Sim2Real", "date": "2026-09-28", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZi 练更新、独立评测后表现稳定。每过一关，都保存对应证据，不跨级领奖。\n\n这期先用已有的alpha_walking.onnx做参考推理，前提是图形会话和观测接口都已通过。它的作用是建立基线：同样的场景、起始状态和输入命令下，参考方案是什么表现？\n\n视频也不只剪最漂亮的两秒。启动过程、命令变化、失败和重置，都值得保留。否则别人很难知道模型是否只是碰巧站住。\n\n现有记录只能确认推理被启动并遇到图形报错，因此本期先说明这套基线方法，不冒充已经完成稳定行走。\n\n我想做的不是“让一段视频看起来成功”，而是让下一次修改有东西可以公平比较。\n\n你觉得技术分享应该把失败片段也放出来吗？\n\n#Microduck #仿真 #预训练模型 #强化学习入门 #复现笔记", "date": "2026-10-02", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDA4PC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3IiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPui3kemAmumihOiuree7gzwvdGV4dD48dGV4dCB4PSI2NSIgeT0iMzIwIiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPuS4jeetieS6juiHquW3seiureaIkDwvdGV4dD48dGV4dCB4PSI2NyIgeT0iMzcyIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMUM3OTZBIiBmb250LXdlaWdodD0iNTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPkRBWS 下一状态，再用奖励评价这次行为；训练在这些反馈上更新策略。\n\nPPO可以粗略理解成：尝试改善动作选择，同时约束每次更新不要变化得太激进。但算法并不知道我心里的“可爱又稳定”，它只接收到实际定义的目标。\n\n因此我会把速度跟踪、姿态、动作平滑等项分开看。总回报上升时，还要问：是否真的跟随命令？是否靠僵硬不动规避惩罚？是否牺牲另一项换来分数？\n\n这期的实验设计是只改一项奖励，其他条件尽量固定，做对照，而不是一次重写整张奖励表。\n\n目前这是待执行的奖励审计，不预告模型一定会钻哪种空子。最想记住的一句：分数是目标的编码，不是目标本身。\n\n你会怎么定义“走得好看”？\n\n#Microduck #PPO #奖励函数 #强化学习 #机器人学习", "date": "2026-10-04", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDA5PC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3IiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPuWlluWKseWcqOa2qDwvdGV4dD48dGV4dCB4PSI2NSIgeT0iMzIwIiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPum4reWNtOayoei1sO+8nzwvdGV4dD48dGV4dCB4PSI2NyIgeT0iMzcyIiBmb250LXNpemU9IjI0IiBmaWxsPSIjMUM3OTZBIiBmb250LXdlaWdodD0iNTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPkRBWSAxN+KAlDE4ICAgLyAgI 种子\n- [ ] 无训练结果时只发布设计，不生成虚构曲线\n\n操作入口：[RUNBOOK L09](../../docs/RUNBOOK.md)；资料：S6、S9，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：真实奖励配置片段\nP3：目标与潜在漏洞对照\nP4：实际A/B曲线，尚未跑则不放\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：真实奖励配置片段", "P3：目标与潜在漏洞对照", "P4：实际A/B曲线，尚未跑则不放"]}, {"id": "10", "title": "一千只鸭，是怎样练出来的", "body": "一千只机械鸭同时练走路，听起来像幼儿园开学。可工程上的第一步，是先让少量环境稳定跑起来。🐣\n\n在向量化训练里，许多环境实例可以共享一套策略，各自收集经历，再用于更新。环境数量、策略数量和GPU数量，是三个不同概念。\n\n本系列先按128→512→1024个环境规划扩容实验。这是拟定的测试档位，不代表我已经跑通，也不保证每档都适合当前软件版本与显存。\n\n还有一个容易被夸大的地方：机器上插了4张GPU，不等于一条训练命令会自动使用4卡。要明确设备选择，确认日志与实际利用率，再谈多卡方案。\n\nGUI同样要拆开看。训练很多环境，不必把所有鸭子都高质量渲染到屏幕上；展示少量代表环境，往往更利于观察动作，而完整数据留在日志里。\n\n这期不晒未经测量的“每秒多少步”。我更关心：环境数增加后，吞吐、显存、失败和观察体验分别发生了什么。\n\n你最想看百鸭同屏，还是看一只鸭的慢动作？\n\n#Microduck #并行仿真 #MuJoCoWarp #GPU训练 #强化学习", "date": "2026-10-06", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2 IBLE_DEVICES，检查日志实际设备\n- [ ] 吞吐标明env-steps/s还是其他计数\n- [ ] 没有完成多卡配置不宣称四卡加速\n\n操作入口：[RUNBOOK L10](../../docs/RUNBOOK.md)；资料：S6，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：真实多环境GUI截图\nP3：nvidia-smi与训练配置\nP4：实测扩容表，未知不填零\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：真实多环境GUI截图", "P3：nvidia-smi与训练配置", "P4：实测扩容表，未知不填零"]}, {"id": "11", "title": "别只存视频，鸭也要写日记", "body": "仿真视频能让人看懂发生了什么，轨迹数据才能帮我追问：为什么会这样？📒\n\n我想给每只训练中的鸭子写一份机器可读的日记。最小记录包括时间步、环境编号、观测、动作、奖励，以及是真正终止，还是时间上限截断。\n\n还要保存容易被忽略的上下文：策略哈希、配置哈希、随机种子、初始状态。少了这些，只剩一大堆数字，也未必能复现同一次实验。\n\n一个重要边界：PPO通常围绕当前策略采集的数据做更新，不是把任意旧视频丢进去就能继续训练。轨迹归档首先服务于排错、评测和后续研究；需要用作离线训练或模仿学习时，必须重新明确算法与数据条件。\n\n相机图像也不会因为装了摄像头，就自动进入现有步态策略。先确认观测合同，再决定数据要不要含RGB。\n\n本期先落地数据格式和校验规则，暂不把样例数据当作真实训练产物。鸭的日记，应该能追溯，不只是能占硬盘。\n\n你更想看动作回放，还是能下载的实验记录？\n\n#Microduck #数据集制作 #机器人数据 #PPO #可复现研究", "date": "2026-10-08", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6 4", "title": "不是每块小板，都能直接替", "body": "买齐零件之前，我想先解决一个很现实的问题：一块板子，究竟在替谁工作？🔧\n\n我把机器鸭的电路拆成主控计算、电源分配、舵机通信和姿态传感四类职责。它们可能集成在一块HAT里，也可能分开实现，但职责不能凭外观猜。\n\n“都有IMU”并不代表两块板能直接互换。传感器型号、坐标方向、采样频率、时间戳，以及运行时读取的协议，都影响兼容性。能通过I2C读出加速度，不等于已经满足原有IMU-to-DXL的数据合同。\n\n同样，GPIO排针兼容，不自动意味着电压、电源走向和半双工通信方向控制都兼容。\n\n这期先做功能替代表，而不把未经打样的社区PCB写成即插即用成品。每个候选件标注：官方资料确认、仅代码线索、设计推断，还是待实物测试。\n\n我希望后面的采购不是“别人用了我也买”，而是知道少了哪一块能力，以及打算怎样验证它。\n\n你更愿意先用成熟模块，还是从PCB开始复刻？\n\n#Microduck #机器人硬件 #IMU #开源硬件 #复现清单", "date": "2026-10-14", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiPkVQIDE0PC90ZXh0PjxwYXRoIGQ9Ik02NSAxMTFIMTAxNSIgc3Ryb2tlPSIjMTgzNDM1IiBzdHJva2Utd2lkdGg9IjIiLz48dGV4dCB4PSI2NSIgeT0iMjE3IiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPuWwj+adv+mVv+W+l+WDjzwvdGV4dD48dGV4dCB4PSI2NSIgeT0iMzIwIiBmb250LXNpemU9Ijc4IiBmaWxsPSIjMTgzNDM1IiBmb250LXdlaWdodD0iOTAwIiB0ZXh0LWFuY2hvcj0ic3RhcnQiPuiBjOi0o+acquW/heS4gOagtzwvdGV4 把HAT内置IMU与独立IMU-to-DXL默认等同\n- [ ] 社区PCB资源不等于已验证成品\n- [ ] 针脚必须绑定实际板版本的原理图\n- [ ] I2C替代路线列出运行时代码改动和回归计划\n\n操作入口：[RUNBOOK L14](../../docs/RUNBOOK.md)；资料：S11、S12，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：实际已到货板件，不拿渲染代替\nP3：功能分工图\nP4：候选与已验证的替代表\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：实际已到货板件，不拿渲染代替", "P3：功能分工图", "P4：候选与已验证的替代表"]}, {"id": "15", "title": "代码写7.4V，舵机敢接吗", "body": "这期的主角不是算法，而是万用表。因为代码里的一个数字，不能替硬件说明书签字。⚡\n\n现有仿真日志曾出现7.40V参数，但标准XL330-M288-T的官方输入范围是3.7–6.0V，推荐5.0V。仿真执行器模型中的电压，绝不能直接抄成实物供电方案。\n\n我给硬件准备设了一条硬规则：先确认准确型号，再谈电池与稳压。不要把常见2S锂电包的电压直接送给标准XL330，也不要把主控供电能力当成所有舵机的电流预算。\n\n拟采用的思路是按功能分支供电、明确公共参考地，并检查保护、线径、接插件与回流路径。具体板端针脚和电源是否贯通，必须由当前板版次和测量确认。\n\n顺手提醒一个概念：供电正负两端不是把舵机一颗颗电气串联。物理线缆能菊花链连接，不代表负载是在串联分压。\n\n本期先把安全红线讲清楚，不发布未验证的精确接线图。亮灯不算通过，电压、极性和负载下的表现才算。\n\n你会在首次上电前量几遍电压？\n\n#Microduck #XL330 #机器人供电 #硬件安全 #电子制作", "date": "2026-10-16", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQge 行\n\n操作入口：[RUNBOOK L15](../../docs/RUNBOOK.md)；资料：S13，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：实际舵机型号铭牌\nP3：万用表实测电压和测试条件\nP4：经版本确认的电源图，未确认则只放功能图\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：实际舵机型号铭牌", "P3：万用表实测电压和测试条件", "P4：经版本确认的电源图，未确认则只放功能图"]}, {"id": "16", "title": "第一颗舵机，先别让它动", "body": "舵机到手，最诱人的测试是让它转一下。但我给第一颗舵机安排的任务，是先“自我介绍”。🤖\n\n只接一颗、确认供电和半双工适配器后，先读型号、ID、当前位置、电压、温度和错误状态。型号对不上，就不套用另一个型号的寄存器地址。\n\n为什么不一开始把所有舵机挂上去？因为重复ID、通信参数不同、线缆接错，都可能让问题叠在一起。单颗确认后再登记唯一ID，扩展总线时才有清楚的参照。\n\n这一阶段不广播写配置，不默认上扭矩，也不直接下发“回零”。软件的零位置，不一定是机械结构的安全位置。\n\n等读数、映射和限位核对完成，再把受控小范围运动作为下一道独立关卡：卸载或可靠固定，操作人员避开夹点，并准备物理急停。\n\n本期分享的是安全的测试顺序，不代表舵机已完成运动验收。我想让它以后走得稳，先让每一步测试都说得清。\n\n你第一次测试电机，会先看哪些反馈？\n\n#Microduck #Dynamixel #XL330 #舵机测试 #机器人调试", "date": "2026-10-18", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJlbmQiP - [ ] 准确型号号匹配后才读取对应寄存器\n- [ ] 没有响应时查供电/波特率/半双工适配器，不能强行升压\n- [ ] 后续运动必须另行检查零位、方向、限位和急停\n\n操作入口：[RUNBOOK L16](../../docs/RUNBOOK.md)；资料：S13、S14，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：单颗舵机台架实拍\nP3：只读反馈日志\nP4：ID标签和对应记录\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：单颗舵机台架实拍", "P3：只读反馈日志", "P4：ID标签和对应记录"]}, {"id": "17", "title": "鸭往左歪，IMU说往右？", "body": "假设鸭子向左歪，传感器却告诉控制器“向右”，再聪明的策略也可能越救越歪。🧭\n\n所以IMU测试，我不从“有数字刷新”毕业，而从坐标系开始。板子坐标系、机身坐标系和策略期望的坐标系，必须说的是同一件事。\n\n测试顺序是静止、分轴缓慢转动、再做多个已知朝向。看角速度符号、重力方向、单位和时间戳是否符合预期。静止时陀螺接近零，也不等于加速度应该全是零。\n\n若固件提供四元数，还要核对分量顺序和旋转方向。采样频率、通信接收频率和控制器消费频率，也不能只挑一个最好看的数字汇报。\n\n这期暂不把某份社区固件的ID或波特率当作我的实物配置。先确认板型与固件，再按对应接口记录原始值。\n\n最值得保留的照片可能很朴素：板上贴着XYZ箭头，旁边同步显示原始日志。它比一个“姿态正常”的结论更可靠。\n\n你被坐标系的正负号坑过吗？\n\n#Microduck #IMU #机器人姿态 #坐标系 #嵌入式调试", "date": "2026-10-20", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90byBTYW5zIENKSyBUQywgUGluZ0ZhbmcgU0MsIE1pY3Jvc29mdCBZYUhlaSwgc2Fucy1zZXJpZiI+PHJlY3Qgd2lkdGg9IjEwODAiIGhlaWdodD0iMTQ0MCIgZmlsbD0iI0Y3RjRFQSIvPjxyZWN0IHg9IjYwIiB5PSI0MTAiIHdpZHRoPSI5NjAiIGhlaWdodD0iNjAwIiByeD0iMzQiIGZpbGw9InVybCgjZ3JpZCkiLz48dGV4dCB4PSI2NSIgeT0iNzciIGZvbnQtc2l6ZT0iMjUiIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2VpZ2h0PSI4MDAiIHRleHQtYW5jaG9yPSJzdGFydCI+TUlDUk9EVUNLIC8gNDDlpKnlpI3njrDlrp7pqow8L3RleHQ+PHRleHQgeD0iMTAxNSIgeT0iNzkiIGZvbnQtc2l6ZT0iMjciIGZpbGw9IiMxQzc5NkEiIGZvbnQtd2V 成任何字母、汉字、数字、logo、水印、假代码、假日志、假性能图表。不得模拟用户已完成的测试，不用照片级画面充当实物证据。不得绘制未经确认的精确针脚、电源接线或可误导的装配尺寸。图像仅作概念插画，发布时必须另行添加“AI示意图，非实测”。\n\n本期主题：鸭往左歪，IMU说往右？\n画面内容：有XYZ箭头的小型传感器板与机身坐标架并列，一根清晰转换箭头连接，两边颜色一致，不模拟真实读数。\n后期排版主标题：姿态有数据 / 不代表方向对（仅供理解，不在生成图中画字）。", "checklist": "# EP17｜鸭往左歪，IMU说往右？\n\n实验：2026-10-19–2026-10-20；建议发布：2026-10-20。\n\n## 第一天\n核对实际传感器/固件/协议；给板与机身标XYZ；保存静止原始数据和时间戳。\n\n## 第二天\n分轴缓慢旋转与多朝向测试；填写frame_contract.md，不先做复杂滤波掩盖错误。\n\n## 技术验收\n- [ ] 轴向、单位、四元数顺序和旋转约定明确\n- [ ] 区分传感器采样、串口到达和控制消费频率\n- [ ] 数据超时有故障策略而不是沿用旧姿态\n- [ ] 不把I2C原始值直接塞进未核对的DXL观测合同\n\n操作入口：[RUNBOOK L17](../../docs/RUNBOOK.md)；资料：S6、S11，见[SOURCES](../../docs/SOURCES.md)。\n\n## 配图顺序\nP1：本期技术示意封面（非GPT生成、非实测）。\nP2：贴XYZ箭头的实物IMU\nP3：分轴转动与原始数据同步画面\nP4：坐标变换表\n\n## 失败也可以发布\n未通过时保留方法正文，补充实际错误、已排除项、下一次只改变的变量。不要填写不存在的成功结果。\n\n## 实测补充槽位（内部使用，不直接复制）\n实际环境：\n原始证据路径：\n实际结果与单位：\n未解决项：\n公开图已检查隐私：否\n", "photos": ["P2：贴XYZ箭头的实物IMU", "P3：分轴转动与原始数据同步画面", "P4：坐标变换表"]}, {"id": "18", "title": "终于拼鸭，为什么还不通电", "body": "螺丝和结构件终于轮到主角位置了。但这一期，我想让机器鸭先当一个安静的模型。🪛\n\n干装阶段最重要的不是“看起来像不像”，而是左右件有没有装反、线束会不会被夹、关节活动范围里有没有干涉。\n\n每个关节都要回到那张映射表：模型名字、实物位置、舵机ID、方向、机械参考位和限位。仿真中的正方向，不会因为装配看起来对称，就自动与实物一致。\n\n安装舵盘前先核对参考位；不要把装好的机构强行掰到软件零位，也不要靠通电让舵机顶着结构“找位置”。紧固要求以所用零件资料为准，不随意发明通用扭矩。\n\n相机排线和IMU安装也一起检查：有没有拉扯、有无应力释放、安装方向是否会改变先前的坐标约定。\n\n这期的合格画面不是站起来，而是断电状态下的完整检查记录。装得慢一点，是为了后面每一个动作都有安全空间。\n\n你拼装时更怕剩螺丝，还是多出一个不认识的零件？\n\n#Microduck #机器人拼装 #3D打印 #机械结构 #开源机器人", "date": "2026-10-22", "img": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDgwIiBoZWlnaHQ9IjE0NDAiIHZpZXdCb3g9IjAgMCAxMDgwIDE0NDAiPjxkZWZzPjxtYXJrZXIgaWQ9ImFycm93IiBtYXJrZXJXaWR0aD0iOSIgbWFya2VySGVpZ2h0PSI5IiByZWZYPSI4IiByZWZZPSI0IiBvcmllbnQ9ImF1dG8iPjxwYXRoIGQ9Ik0wIDBMOCA0TDAgOCIgZmlsbD0iIzFDNzk2QSIvPjwvbWFya2VyPjxwYXR0ZXJuIGlkPSJncmlkIiB3aWR0aD0iNDAiIGhlaWdodD0iNDAiIHBhdHRlcm5Vbml0cz0idXNlclNwYWNlT25Vc2UiPjxwYXRoIGQ9Ik00MCAwSDBWNDAiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI0RERTNEOSIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9wYXR0ZXJuPjwvZGVmcz48ZyBmb250LWZhbWlseT0iTm90byBTYW5zIENKSyBTQywgTm90 function show(i){current=i;const e=cards[i];$('title').textContent=e.title;$('body').textContent=e.body;$('checklist').textContent=e.checklist;$('photoPlan').textContent='P1：技术示意封面\n'+e.photos.join('\n');$('cover').src=e.img;$('badge').textContent='EP '+e.id;$('date').textContent='建议发布 '+e.date;$('txt').href='posts/'+e.id+'/body.txt';document.querySelectorAll('nav button').forEach((b,j)=>b.className=i===j?'active':'');$('msg').textContent='';}
async function copy(field){let e=cards[current],value=field==='all'?e.title+'\n\n'+e.body:e[field];try{await navigator.clipboard.writeText(value);$('msg').textContent='已复制。请在发布前检查实际进度与配图。';}catch(err){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();$('msg').textContent=ok?'已复制。':'浏览器不允许复制，请手工选择正文。';}}
function png(){const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=1080;c.height=1440;c.getContext('2d').drawImage(img,0,0,1080,1440);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=cards[current].id+'-technical-cover.png';a.click();$('msg').textContent='已下载技术示意封面；非GPT图、非实测。';}catch(e){$('msg').textContent='PNG导出失败，请用本地HTTP预览或使用包内PNG。';}};img.src=cards[current].img;}
