<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Microduck · 40天复现实验</title><style>
:root{--ink:#183435;--paper:#f7f4ea;--mint:#cde8de;--green:#1c796a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:42px max(24px,6vw);border-bottom:1px solid #b9c9bd}h1{font-size:clamp(25px,4vw,44px);line-height:1.3;margin:0 0 14px}.eyebrow{letter-spacing:3px;font-size:12px;color:var(--green);font-weight:700}.notice{max-width:1000px;font-size:15px}.layout{display:grid;grid-template-columns:280px 1fr;max-width:1400px;margin:24px auto;padding:0 24px;gap:30px}nav{max-height:85vh;overflow:auto;position:sticky;top:16px}nav button{display:block;text-align:left;width:100%;border:0;border-radius:8px;padding:12px;background:transparent;font-size:14px;color:var(--ink);cursor:pointer}nav button.active{background:var(--mint);font-weight:bold}.panel{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:30px}.cover{width:100%;display:block;border-radius:12px;border:1px solid #bed0c3}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,a.btn{padding:10px 14px;background:var(--green);color:white;border:0;border-radius:8px;cursor:pointer;text-decoration:none;font:inherit;font-size:14px}.secondary{background:#e3e8df;color:var(--ink)}pre{white-space:pre-wrap;word-break:break-word;font:15px/1.95 inherit;background:#fff;padding:24px;border-radius:12px;border:1px solid #d9e1d6}details{margin:16px 0;background:#fff;padding:15px;border-radius:8px}summary{cursor:pointer;font-weight:700}#msg{color:var(--green);min-height:1.8em;font-size:14px}.tag{font-size:12px;padding:4px 10px;background:var(--mint);border-radius:12px;margin-right:10px}.photos img{max-width:46%;max-height:200px;margin:6px;border-radius:8px}footer{padding:30px;text-align:center;font-size:13px;color:#60776b}@media(max-width:950px){.layout{grid-template-columns:1fr}nav{position:static;display:flex;max-height:130px;flex-wrap:wrap}nav button{width:auto}.panel{grid-template-columns:1fr}.visual{max-width:400px}pre{padding:16px}}
</style><header><div class="eyebrow">MICRODUCK LAB NOTES / 20 EPISODES</div><h1>40天，从看到画面到安全装配。</h1><div class="notice">20期正文可以按篇复制。先阅读每期清单，再补实测照片与结果。这里不会登录或代发小红书；标题与正文仍需粘贴到发布页并上传图片。技术封面是程序绘制示意图，<b>不是GPT生成图，也不是实测照片</b>。20份GPT生图稿已单独准备，实际生成状态在仓库中追踪。</div></header><div class="layout"><nav id="nav"></nav><main><div id="msg" role="status"></div><div class="panel"><div class="visual"><img class="cover" id="cover" alt="本期技术示意封面"><div class="controls"><button onclick="png()">下载封面PNG</button><button class="secondary" onclick="copy('prompt')">复制GPT生图稿</button></div><p style="font-size:13px">封面PNG为1080×1440。真实照片可在下方临时预览；不上传到任何服务，刷新后会清除。</p><input type="file" accept="image/*" multiple onchange="preview(this.files)"><div class="photos" id="photos"></div></div><div><span class="tag" id="badge"></span><span id="date"></span><h2 id="title"></h2><div class="controls"><button onclick="copy('title')">复制标题</button><button onclick="copy('body')">复制正文</button><button class="secondary" onclick="copy('all')">复制标题＋正文</button><a class="btn secondary" id="txt" download>正文TXT</a></div><pre id="body"></pre><details><summary>技术清单 · 两日操作与验收</summary><pre id="checklist"></pre></details><details><summary>实拍配图清单</summary><pre id="photoPlan"></pre></details></div></div></main></div><footer>方法不冒充实测 · 参考推理不冒充自训 · 支撑站立不冒充自主平衡</footer><script>
const cards=__CARDS_JSON__;let current=0;const $=id=>document.getElementById(id);
function show(i){current=i;const e=cards[i];$('title').textContent=e.title;$('body').textContent=e.body;$('checklist').textContent=e.checklist;$('photoPlan').textContent='P1：技术示意封面\n'+e.photos.join('\n');$('cover').src=e.img;$('badge').textContent='EP '+e.id;$('date').textContent='建议发布 '+e.date;$('txt').href='posts/'+e.id+'/body.txt';document.querySelectorAll('nav button').forEach((b,j)=>b.className=i===j?'active':'');$('msg').textContent='';}
async function copy(field){let e=cards[current],value=field==='all'?e.title+'\n\n'+e.body:e[field];try{await navigator.clipboard.writeText(value);$('msg').textContent='已复制。请在发布前检查实际进度与配图。';}catch(err){const t=document.createElement('textarea');t.value=value;document.body.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();$('msg').textContent=ok?'已复制。':'浏览器不允许复制，请手工选择正文。';}}
function png(){const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=1080;c.height=1440;c.getContext('2d').drawImage(img,0,0,1080,1440);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=cards[current].id+'-technical-cover.png';a.click();$('msg').textContent='已下载技术示意封面；非GPT图、非实测。';}catch(e){$('msg').textContent='PNG导出失败，请用本地HTTP预览或使用包内PNG。';}};img.src=cards[current].img;}
function preview(files){$('photos').replaceChildren();for(const f of files){const img=document.createElement('img');const url=URL.createObjectURL(f);img.onload=()=>URL.revokeObjectURL(url);img.src=url;img.alt=f.name;$('photos').appendChild(img);}}
cards.forEach((e,i)=>{const b=document.createElement('button');b.textContent=e.id+'  '+e.title;b.onclick=()=>show(i);$('nav').appendChild(b);});show(0);
</script></html>
